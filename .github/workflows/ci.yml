name: CI   # назва pipeline

on:    #автоматичний запуск / trigger
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build   # 1-й етап
    runs-on: ubuntu-latest  # runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (without tests)
        run: mvn -B -DskipTests package


  unit-tests:  # 2-й етап (needs: build)
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build   # needs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn -B test -Dtest=OrderServiceTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          if-no-files-found: error

  integration-tests:   # 3-й етап (needs: unit-tests)
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests  # needs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure Docker API version for Testcontainers
        run: echo "api.version=1.44" >> ~/.docker-java.properties

      - name: Run integration tests (Testcontainers + PostgreSQL)
        run: mvn -B test -Pregression

      - name: Upload integration test reports # назва артефакту
        if: always()  # зберігати звіт, навіть якщо тести впали
        uses: actions/upload-artifact@v4   # artifact
        with:
          name: integration-test-reports
          path: target/surefire-reports/  # папка зі звітами, які створює Maven після тестів
          if-no-files-found: error   # якщо звіту нема, pipeline це покаже

  e2e-tests: # 4-й етап (needs: integration-tests)
    name: UI / E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      postgres: # реальна БД для E2E (не Testcontainers)
        image: postgres:17
        env:
          POSTGRES_USER: store_student
          POSTGRES_PASSWORD: store_pass
          POSTGRES_DB: store_variant02_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store_student -d store_variant02_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: store_variant02_test
      DB_USER: store_student
      DB_PASSWORD: store_pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply DB migrations
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h localhost -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f migrations/V1__create_tables.sql
          psql -h localhost -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f migrations/V2__add_indexes.sql

      - name: Build backend (UI is served from src/main/resources/static)
        run: mvn -B -DskipTests package

      - name: Start backend
        run: |
          nohup java -jar target/sut-b-store-variant02-1.0-SNAPSHOT.jar > app.log 2>&1 &
          curl -sf --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/index.html > /dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Run E2E tests (chromium + firefox)
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report (screenshots, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: app.log
          if-no-files-found: ignore